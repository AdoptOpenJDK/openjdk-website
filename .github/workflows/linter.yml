name: Linter
on:
  pull_request:
    branches: [ master ]
jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Test
      run: |
        npm install
        npm run test